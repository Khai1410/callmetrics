services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: callmetrics
      POSTGRES_PASSWORD: callmetrics
      POSTGRES_DB: callmetrics
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callmetrics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://callmetrics:callmetrics@db:5432/callmetrics
      STORAGE_DIR: /data/audio
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - ./storage/audio:/data/audio
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    # Port 8000 is only used internally by the frontend's nginx proxy.
    # Uncomment below if you need to call the API directly for debugging:
    # ports:
    #   - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  db_data:
  whisper_cache:
